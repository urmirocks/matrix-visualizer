<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Matrix Visualiser</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            text-align: center;
            background: #eaf3ef;
            color: rgb(0, 36, 27);
            font-family: system-ui, sans-serif
        }

        canvas {
            display: block;
            margin: 0 auto 14px;
            width: min(92vw, 600px);
            height: auto;
            background: #f7fbf9;
            border: 1px solid rgb(78, 135, 140);
            border-radius: 14px
        }

        input[type=number] {
            width: 60px;
            padding: 8px;
            margin: 0 6px 0 2px;
            border-radius: 8px;
            border: 1px solid rgb(78, 135, 140);
            background: #f7fbf9;
            color: rgb(0, 36, 27);
            text-align: center;
            font: inherit
        }

        input[type=number]:focus {
            outline: 2px solid rgb(206, 20, 131);
            outline-offset: 1px
        }

        input[type=range] {
            width: 240px;
            accent-color: rgb(206, 20, 131);
            margin: 14px 8px
        }

        button {
            padding: 8px 14px;
            margin: 4px;
            border-radius: 10px;
            border: 1px solid rgb(78, 135, 140);
            background: rgba(147, 229, 171, .45);
            color: rgb(0, 36, 27);
            font: inherit;
            cursor: pointer
        }

        button:hover {
            border-color: rgb(206, 20, 131);
            background: rgba(147, 229, 171, .8)
        }

        #info {
            color: rgb(40, 90, 95);
            max-width: 520px;
            margin: 12px auto
        }
    </style>
</head>

<body>
    <canvas id="canvas" width="600" height="600"></canvas> <br>
    a <input id="ma" type="number" value="1" step="any" style="width:50px" />
    b <input id="mb" type="number" value="1" step="any" style="width:50px" />
    c <input id="mc" type="number" value="1" step="any" style="width:50px" />
    d <input id="md" type="number" value="1" step="any" style="width:50px" /> <br>
    <input id="sl" type="range" value="100" min="0" max="100" />
    <button id="play">Animate</button>
    <p id="info"></p>
    <script>
        const $ = id => document.getElementById(id);
        const cv = $("canvas");
        const cx = cv.getContext("2d");

        let u = 50;  //pixels per unit
        let o = 300; //origin
        let a = 1, b = 0, c = 0, d = 1; //the matrix

        function readMatrix() {
            const m = ["ma", "mb", "mc", "md"].map(id => parseFloat($(id).value) || 0);
            const t = $("sl").value / 100;
            a = 1 + (m[0] - 1) * t;
            b = m[1] * t;
            c = m[2] * t;
            d = 1 + (m[3] - 1) * t;
            return m;
        }
        function toPixel(x, y) {
            return [o + x * u, o - y * u];
        }
        function transform(x, y) {
            return [a * x + b * y, c * x + d * y]; //where x,y land after transformation
        }
        function line(x1, y1, x2, y2) {
            let [px1, py1] = toPixel(x1, y1);
            let [px2, py2] = toPixel(x2, y2);
            cx.beginPath();
            cx.moveTo(px1, py1);
            cx.lineTo(px2, py2);
            cx.stroke();
        }
        function newLine(x1, y1, x2, y2) { //after transformation
            const [tx1, ty1] = transform(x1, y1);
            const [tx2, ty2] = transform(x2, y2);
            line(tx1, ty1, tx2, ty2);
        }
        cx.strokeStyle = "rgb(78, 135, 140)";
        for (let k = -6; k <= 6; k++) {
            line(k, -6, k, 6);
            line(-6, k, 6, k);
        }
        cx.strokeStyle = "rgb(0, 36, 27)";
        cx.lineWidth = 2;
        for (let k = -6; k <= 6; k++) {
            newLine(k, -6, k, 6);
            newLine(-6, k, 6, k);
        }
        function polygon(points) {
            cx.beginPath();
            points.forEach(([x, y], i) => {
                const [px, py] = toPixel(...transform(x, y));
                i === 0 ? cx.moveTo(px, py) : cx.lineTo(px, py);
            });
            cx.closePath();
        }
        polygon([[0, 0], [1, 0], [1, 1], [0, 1]]);
        cx.fillStyle = "rgba(147, 229, 171,0.7)";
        cx.fill();

        function arrow(x, y, color) {
            const [tx, ty] = transform(x, y);
            const [x0, y0] = toPixel(0, 0), [x1, y1] = toPixel(tx, ty);
            cx.strokeStyle = color; cx.lineWidth = 4;
            cx.beginPath();
            cx.moveTo(x0, y0);
            cx.lineTo(x1, y1);
            cx.stroke();
        }
        arrow(1, 0, "rgb(6, 81, 67)");
        arrow(0, 1, "rgb(206, 20, 131)");

        const presets = {
            "Rotate 90°": [0, -1, 1, 0],
            "Shear": [1, 1, 0, 1],
            "Scale ×2": [2, 0, 0, 2],
            "Squash": [1, 2, 2, 4]
        };
        for (const [name, m] of Object.entries(presets)) {
            const btn = document.createElement("button");
            btn.textContent = name;
            btn.onclick = () => {
                ["ma", "mb", "mc", "md"].forEach((id, i) => $(id).value = m[i]);
                play();
            }
            document.body.appendChild(btn);
        }
        function draw() {
            const m = readMatrix();
            cx.clearRect(0, 0, 600, 600);
            cx.lineWidth = 1; 
            cx.strokeStyle = "rgba(101, 184, 145,2)";
            for (let k = -6; k <= 6; k++) { 
                line(k, -6, k, 6); 
                line(-6, k, 6, k); 
            }
            cx.lineWidth = 2;
             cx.strokeStyle = "rgb(0, 36, 27)";
            for (let k = -6; k <= 6; k++) { 
                newLine(k, -6, k, 6); 
                newLine(-6, k, 6, k); 
            }
            polygon([[0, 0], [1, 0], [1, 1], [0, 1]]);
            cx.fillStyle = "rgba(147, 229, 171,0.7)"; 
            cx.fill(); 
            cx.stroke();
            arrow(1, 0, "rgb(206,20,131)"); 
            arrow(0, 1, "rgb(206, 20, 131)");

            const det = m[0] * m[3] - m[1] * m[2];
            let text = "det = " + Math.round(det * 1000) / 1000 + ". ";
            if (Math.abs(det) < 1e-9) text += "Everything collapses onto a line. Area becomes 0.";
            else text += "Area is multiplied by " + Math.round(Math.abs(det) * 1000) / 1000
                + (det < 0 ? " and the plane is flipped." : ".");
            $("info").textContent = text;
        }

        function play() {
            const start = performance.now();
            function frame(now) {
                const p = Math.min(Math.max((now - start) / 1200, 0), 1);
                $("sl").value = p * 100;
                draw();
                if (p < 1) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }
        ["ma", "mb", "mc", "md", "sl"].forEach((id) => $(id).addEventListener("input", draw));
        $("play").onclick = play;
        draw();
    </script>
</body>

</html>
